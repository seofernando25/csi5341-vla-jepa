[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_policy_vla_jepa_smolvlm"
version = "0.1.0"
description = "Post-training compression and backbone experiments for VLA-JEPA on LIBERO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "lerobot[vla_jepa,training] @ git+https://github.com/huggingface/lerobot.git@30074f7f1358b3c015ae1750017200e86e9c4eb6",
  "huggingface-hub>=0.34",
  "safetensors>=0.5",
  "num2words>=0.5.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]
eval = [
  "bitsandbytes>=0.50.2",
  "hf-libero>=0.1.4,<0.2.0; sys_platform == 'linux'",
  "scipy>=1.14,<2.0",
]
report = [
  "matplotlib>=3.11.2",
  "pandas>=2.2",
  "scipy>=1.14,<2.0",
]

[project.scripts]
vla-eval = "evaluation.run:main"
vla-parallel-rollout = "evaluation.parallel_rollout:main"
vla-core-benchmark = "evaluation.core_benchmark:main"
vla-launch-profile = "evaluation.launch_profile:main"
vla-eval-analyze = "evaluation.analysis:main"
vla-hardware = "evaluation.hardware:main"
vla-sources = "evaluation.sources:main"
vla-compress = "evaluation.compression.study:main"
vla-compress-analyze = "evaluation.compression.analysis:main"
vla-compress-cka = "evaluation.compression.cka:main"
vla-rsi = "rsi.__main__:main"
vla-rsi-round = "rsi.live_round:main"
vla-report-plots = "report.plots.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["evaluation", "rsi", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  # Raised inside a third-party dependency at import time, not by project code.
  "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.metadata]
allow-direct-references = true
