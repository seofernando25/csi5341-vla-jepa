<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSI 5341 · Experiments</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>CSI 5341 <span>/</span> Experiments</strong><span id="connection" role="status">Connecting…</span></header>
<main><div class="live"><label>Search study<select id="study"><option value=".rsi">Active search · GPU processor</option></select></label><span id="stage">Loading</span><progress id="progress" max="100" value="0"></progress><span id="progress-text"></span><small id="totals"></small></div>
<nav aria-label="Views"><button data-view="chart" aria-current="page">Charts</button><button data-view="current">Current run</button><button data-view="runs">Runs <span id="run-count"></span></button><button data-view="proposals">Proposals <span id="proposal-count"></span></button><button data-view="activity">Activity</button></nav>
<section id="chart-view"><div class="toolbar"><label>Results<select id="dataset"><option value="final">Final LIBERO · performance / efficiency</option><option value="benchmarks">Inference · all benchmark runs</option><option value="learning">SmolVLM · validation history</option><option value="screen">Dream-RSI · screens</option><option value="promotion">Dream-RSI · promotions</option></select></label><label id="metric-label">X axis<select id="metric"></select></label><label id="gpu-label">GPU<select id="gpu"></select></label><label id="protocol-label">Timing protocol<select id="protocol"></select></label></div><div id="plot" aria-label="Experiment chart"></div><div class="chart-footer"><span id="plot-note"></span><span id="legend">● Frontier　○ Other runs</span></div></section>
<section id="current-view" hidden><div class="current-heading"><strong id="current-title"></strong><span id="current-stats"></span></div><div id="current-plot" aria-label="Live training loss curve"></div><p class="current-note" id="current-note"></p></section>
<section id="runs-view" hidden><div class="toolbar"><label>Filter<input id="run-search" type="search" placeholder="Model, phase, status…"></label></div><div class="table-wrap"><table><thead><tr><th>Model / run</th><th>Experiment</th><th>Phase</th><th>Status</th><th>Result</th></tr></thead><tbody id="run-rows"></tbody></table></div></section>
<section id="proposals-view" hidden><div class="toolbar"><label>Batch<select id="batch"><option value="all">All batches</option></select></label><label>Search<input id="search" type="search" placeholder="Candidate or proposed change…"></label></div><div class="table-wrap"><table><thead><tr><th>Candidate</th><th>Batch / parent</th><th>Change</th><th>Status</th><th>Loss</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty"></p></section>
<section id="activity-view" hidden><ol id="activity"></ol></section>
<footer><span id="updated"></span><span>Local · read-only · updates every 3s</span></footer></main>
<dialog id="detail"><button id="close" aria-label="Close details">Close ×</button><h2 id="detail-title"></h2><p id="detail-summary"></p><section id="proposal-plan"></section><section id="worker-history"></section><ol id="timeline"></ol><details><summary>Full record & provenance</summary><pre id="detail-body"></pre></details></dialog><script src="/app.js"></script></body></html>
