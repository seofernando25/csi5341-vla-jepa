<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Dream-RSI workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230969da'/%3E%3Cpath d='M4 11V5h3.2a2 2 0 0 1 0 4H4m4 2 2.4-2' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<script src="js/theme-boot.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/tree.css">
<link rel="stylesheet" href="css/transcript.css">
<link rel="stylesheet" href="css/outline.css">
<link rel="stylesheet" href="css/context.css">
<link rel="stylesheet" href="css/proposal.css">
<link rel="stylesheet" href="css/code.css">
<link rel="stylesheet" href="css/evaluation.css">
<link rel="stylesheet" href="css/inspector.css">
<link rel="stylesheet" href="css/policy.css">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#view-host">Skip to the editor</a>
<noscript><p class="empty">This page needs JavaScript to read the live watch.</p></noscript>

<div class="app" id="app">
  <header class="titlebar" id="titlebar" role="banner"></header>

  <div class="body" id="body" data-sidebar="open" data-inspector="open">
    <aside class="sidebar" id="sidebar" aria-label="Explorer and policy development">
      <section class="sidebar-section" data-grow="true" id="tree-pane" aria-label="Discovery tree"></section>
      <section class="sidebar-section" data-grow="false" id="policy-pane" aria-label="Policy development"></section>
    </aside>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"
         aria-label="Resize sidebar" tabindex="0" aria-valuemin="180" aria-valuemax="480"></div>
    <main class="editor" id="editor">
      <div class="tabbar" id="tabbar"></div>
      <div class="viewbar" id="viewbar"></div>
      <div class="editor-body" id="editor-body" data-outline="open">
        <div class="view-host" id="view-host" tabindex="-1"></div>
        <aside class="outline-rail" id="outline" aria-label="Transcript outline"></aside>
      </div>
    </main>

    <div class="splitter" id="splitter-inspector" role="separator" aria-orientation="vertical"
         aria-label="Resize inspector" tabindex="0" aria-valuemin="220" aria-valuemax="440"></div>

    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </div>

  <footer class="statusbar" id="statusbar" aria-label="Status"></footer>
</div>

<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<div id="overlay-root"></div>
<div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
